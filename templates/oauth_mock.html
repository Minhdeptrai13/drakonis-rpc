<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ủy Quyền {{ provider.capitalize() }} OAuth2 | DIPRE Studio</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      background-color: #090a0f;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #e2e8f0;
    }
    .oauth-box {
      background: #111214;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      padding: 2.2rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      text-align: center;
    }
    .oauth-icon-wrap {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.25rem;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .oauth-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
    }
    .oauth-sub {
      font-size: 0.82rem;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .oauth-field {
      text-align: left;
      margin-bottom: 1rem;
    }
    .oauth-field label {
      font-size: 0.78rem;
      font-weight: 700;
      color: #cbd5e1;
      display: block;
      margin-bottom: 6px;
    }
    .oauth-input {
      width: 100%;
      box-sizing: border-box;
      background: #1e1f22;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      color: #ffffff;
      font-size: 0.88rem;
    }
    .oauth-btn {
      width: 100%;
      padding: 0.85rem;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
      margin-top: 1rem;
      transition: all 0.2s ease;
    }
    .oauth-btn.discord { background: #5865f2; color: #ffffff; }
    .oauth-btn.google { background: #ffffff; color: #000000; }
    .oauth-btn:hover { transform: translateY(-2px); opacity: 0.95; }
    .oauth-cancel {
      display: block;
      margin-top: 1rem;
      font-size: 0.8rem;
      color: #64748b;
      text-decoration: none;
    }
    .oauth-cancel:hover { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="oauth-box">
    <div class="oauth-icon-wrap">
      {% if provider == 'discord' %}
      <svg width="32" height="32" viewBox="0 0 24 24" fill="#5865f2"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
      {% else %}
      <svg width="30" height="30" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      {% endif %}
    </div>

    <div class="oauth-title">Ủy Quyền {{ provider.capitalize() }}</div>
    <div class="oauth-sub">
      Ứng dụng <b>DIPRE Studio</b> yêu cầu quyền truy cập tên hiển thị và email để đăng nhập tài khoản của bạn.
    </div>

    <form method="POST" action="/auth/mock/confirm">
      <input type="hidden" name="provider" value="{{ provider }}">
      <div class="oauth-field">
        <label for="oauth-username">Tên người dùng (Username)</label>
        <input type="text" id="oauth-username" name="username" class="oauth-input" value="{% if provider == 'discord' %}Minh{% else %}Minh Nguyen{% endif %}" required>
      </div>
      <div class="oauth-field">
        <label for="oauth-email">Địa chỉ Email</label>
        <input type="email" id="oauth-email" name="email" class="oauth-input" value="{% if provider == 'discord' %}minh@discord.app{% else %}binhminh@gmail.com{% endif %}" required>
      </div>
      <button type="submit" class="oauth-btn {{ provider }}">Phê Duyệt &amp; Đăng Nhập</button>
      <a href="/login" class="oauth-cancel">Hủy bỏ</a>
    </form>
  </div>
</body>
</html>
